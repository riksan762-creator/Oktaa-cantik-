<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffdfb">
<title>Untuk Sayangku Oktaa 🤍</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Pinyon+Script&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --paper:#fffdfb;
  --ink:#3d2a33;
  --soft:#7d6670;
  --rose:#d98ea3;
  --deep:#b4506d;
  --gold:#b8975a;
  --serif:'Cormorant Garamond',Georgia,serif;
  --script:'Pinyon Script',cursive;
  --sans:'Jost',sans-serif;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body {
  min-height:100%;
  max-width:100%;
  overflow-x:hidden;
}

body {
  font-family:var(--sans);
  color:var(--ink);
  background:
    radial-gradient(900px 640px at 15% -8%,#fff 0,transparent 62%),
    radial-gradient(760px 560px at 105% 8%,#fbe6ec 0,transparent 60%),
    radial-gradient(700px 520px at -5% 105%,#f7eddc 0,transparent 60%),
    radial-gradient(600px 500px at 100% 100%,#f3e6f3 0,transparent 60%),
    var(--paper);
  background-attachment:fixed;
}

img {
  max-width:100%;
}

/* PETALS */

#petals {
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}

.petal {
  position:absolute;
  top:-6%;
  color:var(--rose);
  opacity:0;
  animation:fall linear infinite;
}

@keyframes fall {
  0% {
    transform:translate3d(0,0,0) rotate(0);
    opacity:0;
  }
  10% {opacity:.5}
  100% {
    transform:translate3d(var(--dx),112vh,0) rotate(540deg);
    opacity:0;
  }
}

/* CONFETTI */

#confetti {
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:60;
}

/* BALON 3D */

#balloons {
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
  transition:transform 1.6s,opacity 1.6s;
}

#balloons.lift {
  transform:translateY(-12vh);
}

.bal {
  position:absolute;
  width:var(--w);
  perspective:520px;
  animation:bob var(--d) ease-in-out var(--delay) infinite;
}

@keyframes bob {
  0%,100% {transform:translateY(0)}
  50% {transform:translateY(-18px)}
}

.sway {
  position:relative;
  transform-origin:50% 100%;
  animation:sway calc(var(--d) * 1.3) ease-in-out var(--delay) infinite;
}

@keyframes sway {
  0%,100% {transform:rotate(-4deg)}
  50% {transform:rotate(4deg)}
}

.body {
  position:relative;
  width:100%;
  aspect-ratio:.82;
  cursor:pointer;
  pointer-events:auto;
  border-radius:50% 50% 47% 47% / 57% 57% 43% 43%;
  background:radial-gradient(
    circle at 36% 30%,
    var(--c1) 0,
    var(--c2) 58%,
    var(--c3) 100%
  );
  box-shadow:
    inset -12px -18px 28px rgba(60,10,30,.22),
    inset 10px 10px 22px rgba(255,255,255,.4),
    0 22px 34px rgba(150,70,100,.16);
  animation:spin 7s ease-in-out var(--delay) infinite;
  transform-style:preserve-3d;
}

@keyframes spin {
  0%,100% {transform:rotateY(-16deg) rotateX(3deg)}
  50% {transform:rotateY(16deg) rotateX(-3deg)}
}

.body::before {
  content:"";
  position:absolute;
  left:18%;
  top:11%;
  width:28%;
  height:20%;
  border-radius:50%;
  background:radial-gradient(
    ellipse,
    rgba(255,255,255,.95),
    transparent 72%
  );
  transform:rotate(-32deg);
  filter:blur(1px);
}

.knot {
  position:absolute;
  left:50%;
  top:calc(var(--w) * .82 * 1.22 - 5px);
  margin-left:-7px;
  width:0;
  height:0;
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-bottom:11px solid var(--c3);
}

.str {
  position:absolute;
  left:50%;
  top:calc(var(--w) * 1.22 * .82 + 5px);
  width:1.5px;
  height:150px;
  background:linear-gradient(
    rgba(140,105,118,.55),
    transparent
  );
}

.bal.pop .body {
  animation:pop .35s ease-out forwards;
}

@keyframes pop {
  to {
    transform:scale(1.35);
    opacity:0;
  }
}

.bal.pop .knot,
.bal.pop .str {
  opacity:0;
}

/* LAYOUT */

main {
  position:relative;
  z-index:1;
  min-height:100vh;
  min-height:100dvh;
  width:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr);
  place-items:center;
  pointer-events:none;
  padding:60px 22px 40px;
}

.scene {
  display:none;
  width:100%;
  max-width:440px;
  min-width:0;
  text-align:center;
  pointer-events:auto;
}

.scene.on {
  display:block;
  animation:fadeIn 1s ease both;
}

@keyframes fadeIn {
  from {
    opacity:0;
    transform:translateY(16px);
  }
  to {
    opacity:1;
    transform:none;
  }
}

.script {
  font-family:var(--script);
  color:var(--deep);
  font-size:clamp(44px,13.5vw,64px);
  line-height:1.1;
}

.script.gold {
  color:var(--gold);
}

h1 {
  font-family:var(--serif);
  font-weight:400;
  font-style:italic;
  font-size:clamp(25px,7vw,32px);
  line-height:1.3;
  margin:8px 0 12px;
}

.sub {
  font-family:var(--serif);
  font-size:19px;
  line-height:1.6;
  color:var(--soft);
  max-width:34ch;
  margin:0 auto 24px;
}

/* BUTTON */

.btn {
  font:500 15px var(--sans);
  letter-spacing:.04em;
  color:white;
  border:0;
  border-radius:999px;
  padding:15px 34px;
  cursor:pointer;
  background:linear-gradient(135deg,#d98ea3,#b4506d);
  box-shadow:0 10px 24px rgba(180,80,109,.28);
  transition:transform .2s;
}

.btn:active {
  transform:scale(.96);
}

.btn.ghost {
  background:transparent;
  color:var(--deep);
  border:1px solid rgba(180,80,109,.35);
  box-shadow:none;
  padding:11px 22px;
  font-size:13.5px;
}

.btn:focus-visible,
input:focus-visible {
  outline:2px solid var(--deep);
  outline-offset:3px;
}

/* PASSWORD */

.vault {
  background:rgba(255,255,255,.72);
  border:1px solid rgba(184,151,90,.35);
  border-radius:26px;
  padding:34px 24px 28px;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:
    0 30px 60px rgba(150,80,105,.14),
    inset 0 1px 0 white;
}

.seal {
  width:84px;
  height:84px;
  margin:-76px auto 18px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:34px;
  background:radial-gradient(
    circle at 35% 30%,
    #f3d9a6,
    var(--gold) 65%,
    #8e7140
  );
  box-shadow:0 12px 26px rgba(120,90,40,.35);
  transition:transform .8s;
}

.vault.opened .seal {
  transform:translateY(-14px) rotate(-14deg) scale(1.1);
}

.field {
  display:flex;
  gap:10px;
  margin:6px 0 10px;
}

input {
  flex:1;
  min-width:0;
  font:400 16px var(--sans);
  color:var(--ink);
  background:white;
  text-align:center;
  border:1px solid rgba(184,151,90,.5);
  border-radius:999px;
  padding:14px 18px;
}

input::placeholder {
  color:#b9a7ae;
}

.field .btn {
  padding:14px 24px;
}

.msg {
  min-height:1.6em;
  font-family:var(--serif);
  font-size:18px;
  color:var(--deep);
  margin-bottom:6px;
}

.pwhint {
  font-family:var(--serif);
  font-style:italic;
  font-size:18px;
  color:var(--soft);
}

.pwhint b {
  color:var(--gold);
}

.shake {
  animation:shake .45s;
}

@keyframes shake {
  20%,60% {transform:translateX(-8px)}
  40%,80% {transform:translateX(8px)}
}

/* KENANGAN */

.dots {
  display:flex;
  gap:9px;
  justify-content:center;
  margin-bottom:18px;
}

.dots i {
  width:8px;
  height:8px;
  border-radius:50%;
  background:rgba(184,151,90,.3);
  transition:.4s;
}

.dots i.on {
  background:var(--deep);
  transform:scale(1.35);
}

.stage {
  perspective:900px;
  margin-bottom:20px;
}

.card {
  background:white;
  padding:12px 12px 52px;
  border-radius:6px;
  position:relative;
  max-width:330px;
  margin:0 auto;
  box-shadow:
    0 30px 55px rgba(120,60,85,.22),
    0 2px 0 rgba(184,151,90,.4);
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .25s ease-out;
}

.card .cap {
  position:absolute;
  left:0;
  right:0;
  bottom:12px;
  font-family:var(--script);
  font-size:27px;
  color:var(--deep);
}

.card img,
.ph {
  width:100%;
  aspect-ratio:4/5;
  object-fit:cover;
  display:block;
  border-radius:2px;
}

.ph {
  display:grid;
  place-items:center;
  font-size:54px;
  color:var(--rose);
  background:linear-gradient(160deg,#fbe6ec,#f7eddc);
}

.line {
  font-family:var(--serif);
  font-style:italic;
  font-size:clamp(20px,5.6vw,23px);
  line-height:1.5;
  min-height:4.4em;
  margin-bottom:14px;
}

.nav {
  display:flex;
  gap:12px;
  justify-content:center;
}

/* SURAT */

.letter {
  background:rgba(255,255,255,.75);
  border:1px solid rgba(184,151,90,.35);
  border-radius:20px;
  padding:28px 24px 20px;
  margin:20px 0;
  text-align:left;
  backdrop-filter:blur(10px);
  box-shadow:0 24px 50px rgba(150,80,105,.12);
}

.letter p {
  font-family:var(--serif);
  font-size:19.5px;
  line-height:1.72;
  white-space:pre-line;
  min-height:8em;
}

.sign {
  font-family:var(--script);
  font-size:36px;
  color:var(--gold);
  text-align:right;
  margin-top:10px;
}

/* GALERI */

.gallery {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px 14px;
  margin:26px auto 12px;
  width:100%;
  max-width:340px;
  padding:6px;
}

.pol {
  min-width:0;
  background:white;
  padding:7px 7px 24px;
  border-radius:3px;
  box-shadow:0 14px 28px rgba(120,60,85,.2);
  transform:rotate(var(--r));
  transition:transform .3s;
}

.pol:nth-child(5) {
  grid-column:1/-1;
  width:56%;
  margin:0 auto;
}

.pol:active {
  transform:rotate(0) scale(1.05);
}

.thumb {
  position:relative;
  width:100%;
  aspect-ratio:1;
  overflow:hidden;
  background:#f7eddc;
}

.thumb img,
.thumb .ph {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  aspect-ratio:auto;
}

.cake {
  font-size:66px;
  margin:8px 0 4px;
  cursor:pointer;
}

.wish {
  font-family:var(--serif);
  font-style:italic;
  font-size:20px;
  color:var(--deep);
  min-height:1.7em;
  margin:4px 0 20px;
}

/* MUSIC PLAYER */

#musicControl {
  position:fixed;
  top:max(14px,env(safe-area-inset-top));
  right:14px;
  z-index:70;
  display:none;
  align-items:center;
  gap:7px;
}

.musicBtn {
  width:43px;
  height:43px;
  border-radius:50%;
  border:1px solid rgba(184,151,90,.45);
  background:rgba(255,255,255,.94);
  font-size:19px;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(120,60,85,.15);
}

#toast {
  position:fixed;
  left:50%;
  bottom:max(18px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:80;
  background:var(--ink);
  color:white;
  font:400 13px var(--sans);
  padding:12px 18px;
  border-radius:18px;
  display:none;
  width:max-content;
  max-width:88vw;
  text-align:center;
}

@media(prefers-reduced-motion:reduce) {
  .petal,.bal,.sway,.body {
    animation:none!important;
  }
}
</style>
</head>

<body>

<div id="petals"></div>
<div id="balloons"></div>
<canvas id="confetti"></canvas>

<!-- AUDIO: satu elemen untuk seluruh halaman -->
<audio id="bgMusic" preload="auto" loop playsinline>
  <source
    src="./Selamat%20Ulang%20Tahun%20%5BJamrud%5D%20%281%29.mp3"
    type="audio/mpeg">

  <button class="musicBtn" id="playPause" aria-label="Putar atau jeda musik">▶️</button>

<main>

<!-- HALAMAN PASSWORD -->

<!-- HALAMAN SAMBUTAN -->

<section class="scene" id="hello">

  </button>

</main>

<script>
/* ================================================
   KONFIGURASI UTAMA
   ================================================ */

const CONFIG = {
  name: 'Oktaa',
  from: 'Riksan',
  password: 'Oktacantik',

  song: 'Selamat Ulang Tahun [Jamrud] (1).mp3',

  memories: [
    {
      cap:'Awal yang manis',
      line:'Dari semua hari, aku paling bersyukur hari ketika kita bertemu.'
    },
    {
      cap:'Tawamu',
      line:'Tawamu itu suara favoritku. Aku bisa mendengarnya seharian.'
    },
    {
      cap:'Bersamamu',
      line:'Di sampingmu, hal sesederhana apa pun terasa seperti rumah.'
    },
    {
      cap:'Kamu yang kusayang',
      line:'Makasih sudah sabar, sudah mengerti, dan sudah tinggal.'
    },
    {
      cap:'Untuk selamanya',
      line:'Masih ada banyak halaman yang ingin kuisi bersamamu.'
    }
  ],

  letter:
`Oktaa, sayangku.

Hari ini bukan cuma hari kamu bertambah usia. Ini hari ketika dunia dapat satu alasan lagi untuk bersyukur karena kamu ada.

Terima kasih sudah tertawa bersamaku, sudah sabar saat aku belum sempurna, dan sudah memilih tinggal. Kamu membuat hal-hal biasa terasa seperti rumah.

Semoga tahun ini memelukmu dengan hal-hal baik, kesehatan, dan semua doa yang diam-diam kamu simpan.

Di setiap langkahnya, izinkan aku jadi orang yang menggenggam tanganmu.

Aku sayang kamu, hari ini dan seterusnya.`
};

/* ================================================
   HELPER
   ================================================ */

const $ = id => document.getElementById(id);

const norm = s => String(s)
  .toLowerCase()
  .replace(/[^a-z0-9]/g,'');

function toast(message) {
  const el = $('toast');

  el.textContent = message;
  el.style.display = 'block';

  clearTimeout(toast.timer);

  toast.timer = setTimeout(() => {
    el.style.display = 'none';
  },5000);
}

/* ================================================
   AUDIO PLAYER - FIX ANDROID
   ================================================ */

const audio = $('bgMusic');

let muted = false;
let audioReady = false;
let playRequest = null;

// Nama file dibuat menjadi URL yang aman.
const musicURL = './' + encodeURIComponent(CONFIG.song);

// Gunakan satu sumber audio saja.
audio.src = musicURL;
audio.loop = true;
audio.preload = 'auto';
audio.volume = 0.85;

function updateMusicButtons() {
  $('playPause').textContent = audio.paused ? '▶️' : '⏸️';
  $('mute').textContent = muted ? '🔇' : '🔊';
}

function showMusicControls() {
  $('musicControl').style.display = 'flex';
  updateMusicButtons();
}

function startMusic() {
  showMusicControls();

  // Hindari permintaan play berulang secara bersamaan.
  if (!audio.paused) {
    updateMusicButtons();
    return Promise.resolve();
  }

  if (playRequest) return playRequest;

  let request;

  try {
    request = audio.play();
  } catch (err) {
    console.error('Audio play error:',err);
    toast('Musik belum bisa diputar. Tekan tombol ▶️.');
    return Promise.resolve();
  }

  if (!request || typeof request.then !== 'function') {
    updateMusicButtons();
    return Promise.resolve();
  }

  playRequest = request
    .then(() => {
      audioReady = true;
      updateMusicButtons();
    })
    .catch(err => {
      console.error('Gagal memutar musik:',err);

      if (err.name === 'NotAllowedError') {
        toast('Browser meminta izin. Tekan tombol ▶️ untuk memutar musik.');
      } else if (err.name === 'NotSupportedError') {
        toast('Format audio tidak didukung browser.');
      } else {
        toast('Musik belum diputar. Coba tekan tombol ▶️.');
      }

      updateMusicButtons();
    })
    .finally(() => {
      playRequest = null;
    });

  return playRequest;
}

$('playPause').addEventListener('click', () => {
  if (audio.paused) {
    startMusic();
  } else {
    audio.pause();
    updateMusicButtons();
  }
});

$('mute').addEventListener('click', () => {
  muted = !muted;
  audio.muted = muted;
  updateMusicButtons();
});

audio.addEventListener('playing', () => {
  audioReady = true;
  showMusicControls();
});

audio.addEventListener('pause',updateMusicButtons);

audio.addEventListener('ended',() => {
  audio.currentTime = 0;
  startMusic();
});

audio.addEventListener('error',() => {
  const code = audio.error ? audio.error.code : 0;

  console.error('MP3 ERROR:',code);
  console.error('URL:',audio.currentSrc || musicURL);

  if (code === 4) {
    toast('MP3 tidak ditemukan atau format tidak didukung. Periksa file GitHub.');
  } else if (code === 3) {
    toast('File MP3 gagal dibaca. Coba upload ulang lagunya.');
  } else {
    toast('Gagal memuat lagu. Periksa file MP3 dan koneksi internet.');
  }

  showMusicControls();
});

// Persiapkan metadata audio.
audio.addEventListener('loadedmetadata',() => {
  console.log('Durasi musik:',audio.duration);
});

/* ================================================
   FOTO
   ================================================ */

function makeImg(n) {
  const names = [
    `${n}.jpg`,
    `jpg.${n}`,
    `${n}.jpeg`,
    `${n}.png`,
    `${n}.JPG`,
    `jpg${n}`
  ];

  const img = new Image();

  let k = 0;

  img.alt = `Foto ${n}`;
  img.loading = 'lazy';

  img.onerror = () => {
    k++;

    if (k < names.length) {
      img.src = names[k];
    } else {
      const ph = document.createElement('div');

      ph.className = 'ph';
      ph.textContent = '♥';

      img.replaceWith(ph);
    }
  };

  img.src = names[0];

  return img;
}

/* ================================================
   CONFETTI
   ================================================ */

const cv = $('confetti');
const cx = cv.getContext('2d');

let bits = [];
let raf = null;

function sizeCanvas() {
  cv.width = innerWidth;
  cv.height = innerHeight;
}

addEventListener('resize',sizeCanvas);
sizeCanvas();

function burst(
  x=innerWidth/2,
  y=innerHeight*.5,
  n=150
) {
  const colors = [
    '#d98ea3',
    '#b8975a',
    '#e0405c',
    '#cfa6dd',
    '#f0c987',
    '#b4506d'
  ];

  for(let i=0;i<n;i++) {
    bits.push({
      x,y,
      vx:(Math.random()-.5)*14,
      vy:-Math.random()*13-3,
      s:4+Math.random()*6,
      r:Math.random()*6,
      vr:(Math.random()-.5)*.3,
      c:colors[i%colors.length],
      h:Math.random()<.35
    });
  }

  if (raf === null) loopConfetti();
}

function loopConfetti() {
  cx.clearRect(0,0,cv.width,cv.height);

  bits = bits.filter(b=>b.y<cv.height+20);

  bits.forEach(b=>{
    b.x+=b.vx;
    b.y+=b.vy;
    b.vy+=.3;
    b.vx*=.99;
    b.r+=b.vr;

    cx.save();
    cx.translate(b.x,b.y);
    cx.rotate(b.r);
    cx.fillStyle=b.c;

    if(b.h) {
      cx.font=b.s*3+'px serif';
      cx.fillText('♥',0,0);
    } else {
      cx.fillRect(-b.s/2,-b.s/2,b.s,b.s*.6);
    }

    cx.restore();
  });

  if(bits.length) {
    raf=requestAnimationFrame(loopConfetti);
  } else {
    raf=null;
  }
}

/* ================================================
   BUKA PASSWORD
   ================================================ */

let unlocked=false;

function tryOpen() {
  if(unlocked) return;

  const value=norm($('pw').value);

  if(!value) {
    $('msg').textContent='Masukkan kata sandinya dulu, sayang.';
    return;
  }

  if(value===norm(CONFIG.password)) {
    unlocked=true;

    $('open').disabled=true;

    // PENTING:
    // Dipanggil langsung dari interaksi tombol.
    // Jangan menunggu setTimeout sebelum play().
    startMusic();

    $('vault').classList.add('opened');

    $('msg').textContent=
      'Terbuka. Selamat datang, cantik.';

    $('balloons').classList.add('lift');

    burst(
      innerWidth/2,
      innerHeight*.4,
      80
    );

    setTimeout(()=>{
      $('balloons').classList.remove('lift');
      show('hello');
    },1500);

  } else {
    $('msg').textContent=
      'Belum tepat, cantik. Lihat petunjuk di bawah ya.';

    const f=$('pw');

    f.classList.remove('shake');
    void f.offsetWidth;
    f.classList.add('shake');
  }
}

$('open').addEventListener('click',tryOpen);

$('pw').addEventListener('keydown',e=>{
  if(e.key==='Enter') {
    e.preventDefault();
    tryOpen();
  }
});

/* ================================================
   KENANGAN
   ================================================ */

let m=0;

function renderMem() {
  const d=CONFIG.memories[m];

  $('dots').innerHTML=CONFIG.memories.map((_,i)=>{
    return `<i class="${i===m?'on':''}"></i>`;
  }).join('');

  const photo=$('photo');

  photo.innerHTML='';
  photo.appendChild(makeImg(m+1));

  $('cap').textContent=d.cap;
  $('line').textContent=d.line;

  $('prev').style.visibility=m?'visible':'hidden';

  $('next').textContent=
    m===CONFIG.memories.length-1
    ? 'Satu hal terakhir'
    : 'Lanjut';
}

$('go').onclick=()=>{
  m=0;
  show('mem');
  renderMem();
};

$('prev').onclick=()=>{
  if(m>0) {
    m--;
    renderMem();
  }
};

$('next').onclick=()=>{
  if(m<CONFIG.memories.length-1) {
    m++;
    renderMem();
  } else {
    showFinal();
  }
};

/* ================================================
   EFEK KARTU FOTO 3D
   ================================================ */

const card=$('card');

card.addEventListener('pointermove',e=>{
  const r=card.getBoundingClientRect();

  const px=(e.clientX-r.left)/r.width-.5;
  const py=(e.clientY-r.top)/r.height-.5;

  card.style.setProperty('--ry',(px*14)+'deg');
  card.style.setProperty('--rx',(-py*14)+'deg');
});

[
  'pointerleave',
  'pointerup',
  'pointercancel'
].forEach(ev=>{
  card.addEventListener(ev,()=>{
    card.style.setProperty('--rx','0deg');
    card.style.setProperty('--ry','0deg');
  });
});

/* ================================================
   SURAT CINTA
   ================================================ */

let typer=null;

function typeLetter() {
  clearInterval(typer);

  const el=$('letter');
  const text=CONFIG.letter;

  let i=0;

  el.textContent='';
  $('sign').textContent='';

  typer=setInterval(()=>{
    i++;

    el.textContent=text.slice(0,i);

    if(i>=text.length) {
      clearInterval(typer);
      $('sign').textContent='— '+CONFIG.from;
    }
  },32);
}

// Ketuk surat untuk menampilkan semua teks.
$('letter').parentElement.addEventListener('click',()=>{
  clearInterval(typer);

  $('letter').textContent=CONFIG.letter;
  $('sign').textContent='— '+CONFIG.from;
});

/* ================================================
   GALERI FOTO
   ================================================ */

function buildGallery() {
  const g=$('gallery');

  g.innerHTML='';

  const rotations=[-4,3,3,-3,-1.5];

  for(let n=1;n<=5;n++) {
    const pol=document.createElement('div');

    pol.className='pol';

    pol.style.setProperty(
      '--r',
      rotations[n-1]+'deg'
    );

    const th=document.createElement('div');
    th.className='thumb';

    th.appendChild(makeImg(n));
    pol.appendChild(th);
    g.appendChild(pol);
  }
}

function showFinal() {

  buildGallery();
  typeLetter();

  $('cake').classList.remove('out');

  $('wish').textContent=
    'Semoga semua doamu terkabul, '+CONFIG.name+'.';

  burst(
    innerWidth/2,
    innerHeight*.6,
    160
  );
}

$('cake').onclick=blowCandles;

$('cake').addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' ') {
    e.preventDefault();
    blowCandles();
  }
});

$('again').onclick=()=>{
  clearInterval(typer);
  m=0;

};
